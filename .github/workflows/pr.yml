# Dispatcher. Runs on every PR, decides which services changed, and fans out.
#
# The service list is declared ONCE, here, in the paths-filter block. Helm
# release names, image names and job names all derive from it, so renaming a
# service is one edit plus a `git mv`.
name: PR

on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # dorny/paths-filter asks the API which files the PR touched. Without this
  # it fails with "Resource not accessible by integration" — and because every
  # service job is gated on its output, they all skip rather than fail.
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      atlas: ${{ steps.filter.outputs.atlas }}
      lark: ${{ steps.filter.outputs.lark }}
      harbor: ${{ steps.filter.outputs.harbor }}
      portalweb: ${{ steps.filter.outputs.portalweb }}
      portaladmin: ${{ steps.filter.outputs.portaladmin }}
      portalforms: ${{ steps.filter.outputs.portalforms }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Every lib a service compiles into belongs in its filter. atlas
            # referenced libs/observability without listing it, so a change
            # there could break atlas and go green: the only job that would
            # have caught it never ran.
            atlas:
              - 'src/atlas/**'
              - 'libs/audit/**'
              - 'libs/contracts/**'
              - 'libs/data/**'
              - 'libs/observability/**'
            lark:
              - 'src/lark/**'
              - 'libs/contracts/**'
              - 'libs/data/**'
              - 'libs/observability/**'
              # Not a lib, and listed for the same reason the libs are. The
              # scale rule that wakes lark is a copy of ClaimAsync's predicate
              # written as a string in apps.bicep, and lark's tests now read it
              # out of that file to check the two still agree. So editing the
              # template can break the lark suite, and without this line the
              # only job that would catch it never runs -- which is exactly how
              # the two drifted apart in the first place.
              - 'deploy/azure/**'
            harbor:
              - 'src/harbor/**'
              - 'libs/contracts/**'
              - 'libs/observability/**'
            portalweb:
              - 'src/portalweb/**'
              - 'libs/contracts/**'
              - 'libs/ui/**'
            portaladmin:
              - 'src/portaladmin/**'
              - 'libs/contracts/**'
              - 'libs/ui/**'
            portalforms:
              - 'src/portalforms/**'
              - 'libs/contracts/**'
              - 'libs/ui/**'
            contracts:
              - 'libs/contracts/**'
            # Also in lark's filter above, and both are wanted: lark's suite
            # checks that the scale-rule query still agrees with ClaimAsync,
            # while this one checks the templates compile and that every
            # environment still supplies every parameter. Neither subsumes the
            # other, and until both existed a change here ran no job at all.
            infra:
              - 'deploy/azure/**'
              # And this file, so that editing the infra job runs the infra job.
              # Otherwise a change to the gate is the one change the gate never
              # sees, which is the shape of every gap in this file's history.
              - '.github/workflows/pr.yml'

  atlas:
    needs: changes
    if: needs.changes.outputs.atlas == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    with:
      service: atlas
      path: src/atlas

  lark:
    needs: changes
    if: needs.changes.outputs.lark == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    with:
      service: lark
      path: src/lark

  harbor:
    needs: changes
    if: needs.changes.outputs.harbor == 'true'
    uses: ./.github/workflows/build-dotnet.yml
    with:
      service: harbor
      path: src/harbor

  portalweb:
    needs: changes
    if: needs.changes.outputs.portalweb == 'true'
    uses: ./.github/workflows/build-node.yml
    with:
      service: portalweb
      path: src/portalweb

  portaladmin:
    needs: changes
    if: needs.changes.outputs.portaladmin == 'true'
    uses: ./.github/workflows/build-node.yml
    with:
      service: portaladmin
      path: src/portaladmin

  portalforms:
    needs: changes
    if: needs.changes.outputs.portalforms == 'true'
    uses: ./.github/workflows/build-node.yml
    with:
      service: portalforms
      path: src/portalforms

  contract-tests:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    uses: ./.github/workflows/contract-tests.yml

  # Nothing compiled these templates before this job existed. A bicep error
  # therefore surfaced as a failed deploy -- for production, after the approval,
  # with the images already built -- and a parameter added to main.bicep without
  # being added to both .bicepparam files surfaced the same way, on whichever
  # environment happened to be deployed second.
  #
  # build-params is the half that catches that second case. It resolves
  # readEnvironmentVariable at compile time, so a parameter with no default and
  # no variable fails with BCP427 here rather than at deploy time.
  #
  # The three variables below are dummies and their values are never used, only
  # their presence. Every other parameter has a default; these three
  # deliberately do not, because a deploy with no IMAGE_TAG is a deploy of
  # nothing.
  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep
        run: az bicep install

      - name: Compile the templates
        run: |
          set -euo pipefail
          for template in deploy/azure/main.bicep deploy/azure/seed-staging.bicep; do
            echo "== $template"
            az bicep build --file "$template" --stdout > /dev/null
          done

      - name: Compile each environment's parameters
        env:
          IMAGE_TAG: ci
          DB_PASSWORD: ci-placeholder-never-used
          SUPER_ADMIN_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          for params in deploy/azure/staging.bicepparam deploy/azure/prod.bicepparam; do
            echo "== $params"
            az bicep build-params --file "$params" --stdout > /dev/null
          done

  # The only check marked required in branch protection. Never the service
  # jobs themselves: GitHub treats a skipped job as never-completing when it
  # is required, so a docs-only PR would sit pending forever.
  ci-gate:
    # `changes` is in this list deliberately. Without it, a dispatcher failure
    # leaves every service job skipped, the loop below sees nothing but
    # "skipped", and the gate goes green having verified nothing at all.
    needs:
      [
        changes, atlas, lark, harbor,
        portalweb, portaladmin, portalforms, contract-tests, infra,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for result in ${{ join(needs.*.result, ' ') }}; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "A required job failed: $result"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped."
